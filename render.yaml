services:
  - type: web
    name: tw-equity-static
    runtime: static
    buildCommand: pip install -r requirements.txt && python -B twse-limit-up-site/export_static.py
    staticPublishPath: twse-limit-up-site/public
    headers:
      - path: /data/*
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
