name: Update static market report

on:
  schedule:
    - cron: "30 11 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-static-market-report
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch official data and update snapshot
        working-directory: twse-limit-up-site
        run: python -B export_static.py --refresh

      - name: Commit updated report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add twse-limit-up-site/static_report.json
          if git diff --cached --quiet; then
            echo "Report is already current."
          else
            git commit -m "Update static market report"
            git push
          fi
